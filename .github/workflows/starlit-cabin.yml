name: Starlit Cabin provider tests
on:
  push:
    paths: ['starlit-cabin/**', '.github/workflows/starlit-cabin.yml']
  pull_request:
    paths: ['starlit-cabin/**', '.github/workflows/starlit-cabin.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python starlit-cabin/cabin/test_llm.py
